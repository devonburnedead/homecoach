<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a8f5a">
<title>Home Coach</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#fffaf2;--ink:#17201b;--soft:#4a544e;--line:#e7e1d6;--card:#fff;--go:#0a8f5a;--goink:#0a6b44;--tint:#e8f5ee;--empty:#f1efe9;--sun:#f4b400;--bad:#d9480f}
@media(prefers-color-scheme:dark){:root{--bg:#121614;--ink:#eef2ee;--soft:#a9b3ac;--line:#2a332d;--card:#1a211d;--goink:#6fd3a5;--tint:#1d3327;--empty:#202823}}
*{box-sizing:border-box;min-width:0}
[hidden]{display:none!important}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:18px/1.5 Mukta,"Noto Sans Devanagari",system-ui,sans-serif}
.wrap{max-width:560px;margin:0 auto;padding:max(16px,env(safe-area-inset-top)) 16px max(32px,env(safe-area-inset-bottom))}
h1{font-size:30px;line-height:1.1;margin:8px 0 12px;font-weight:800}
h2{font-size:22px;margin:28px 0 10px;font-weight:800}
p{margin:4px 0}
.soft{color:var(--soft);font-size:16px}
button{font:inherit;color:inherit;cursor:pointer}
.today{background:var(--go);color:#fff;border-radius:20px;padding:20px;margin:16px 0}
.today .lab{font-size:17px;opacity:.9}
.today .what{font-size:28px;font-weight:800;line-height:1.15;margin:2px 0 10px}
.today .figs{display:flex;flex-wrap:wrap;gap:5px}
.today .figs svg{width:38px;height:38px;background:rgba(255,255,255,.15);border-radius:50%}
.today button{width:100%;min-height:64px;border:0;border-radius:14px;background:#fff;color:#0a6b44;font-size:22px;font-weight:800;margin-top:16px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 12px}
.stat b{display:block;font-size:30px;line-height:1.1;color:var(--goink)}
.stat span{font-size:15px;color:var(--soft)}
.chart{display:grid;grid-template-columns:repeat(14,minmax(0,1fr));gap:4px;align-items:end;height:110px;margin-top:12px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 10px 0}
.chart div{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;font-size:12px;color:var(--soft)}
.chart i{display:block;width:100%;background:var(--go);border-radius:4px 4px 0 0;min-height:2px}
.chart i.h{opacity:.45}
.goal{display:flex;align-items:center;gap:6px;margin-top:12px;font-size:17px}
.goal i{width:18px;height:18px;border-radius:50%;border:2px solid #fff}
.goal i.on{background:#fff}
.goal span{margin-left:4px}
.chart i.z{background:var(--empty)}
.chart div.now span{color:var(--ink);font-weight:800}
.ex{display:grid;grid-template-columns:60px 1fr auto auto;gap:4px 10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:10px 10px 10px 12px;margin:10px 0}
.ex.off{opacity:.55}
.ex svg{width:60px;height:60px}
.ex b{font-size:20px;display:block;line-height:1.2}
.ex .soft{font-size:15px;line-height:1.3;display:block}
.tog{min-height:48px;min-width:56px;border-radius:12px;border:2px solid var(--line);background:var(--card);font-size:15px;font-weight:800;padding:4px 8px}
.tog.on{border-color:var(--go);background:var(--tint);color:var(--goink)}
.play{width:48px;height:48px;border-radius:50%;border:0;background:var(--go);color:#fff;font-size:18px;display:grid;place-items:center}
.pill{background:var(--tint);color:var(--goink);border-radius:999px;padding:2px 10px;font-weight:800;font-size:14px;white-space:nowrap}
.fig{fill:none;stroke:var(--go);stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
.fig .hd{fill:var(--go);stroke:none}
.fig .prop{stroke:var(--soft);stroke-width:3;opacity:.6}
.today .fig,#cd .fig{stroke:#fff}.today .fig .hd,#cd .fig .hd{fill:#fff}.today .fig .prop,#cd .fig .prop{stroke:#fff}
.dcard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 16px;margin:8px 0}
.dcard b{font-size:18px}
.dcard div{display:flex;justify-content:space-between;gap:10px;font-size:17px}
.st{color:var(--sun)}
details{margin-top:28px;border-top:1px solid var(--line);padding-top:12px}
summary{font-size:20px;font-weight:800;cursor:pointer;min-height:44px;display:flex;align-items:center}
.btn{min-height:52px;padding:8px 16px;border-radius:12px;border:2px solid var(--line);background:var(--card);font-size:18px}
.btn.on{border-color:var(--go);background:var(--tint);font-weight:800}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}
code{font-size:16px;word-break:break-all;background:var(--empty);padding:2px 6px;border-radius:6px}
.big{width:100%;min-height:64px;border:0;border-radius:16px;background:var(--go);color:#fff;font-size:22px;font-weight:800}
.place{text-align:center}
.place svg{width:100%;max-width:420px;height:auto;margin:8px auto;display:block}
.place p{font-size:22px;line-height:1.4;margin:12px 0 20px}
#cam{position:fixed;inset:0;background:#000;display:flex;flex-direction:column;color:#fff}
#stage{position:relative;flex:1;overflow:hidden}
#stage video,#stage canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.mirror{transform:scaleX(-1)}
#hud{position:absolute;left:0;right:0;top:0;padding:max(12px,env(safe-area-inset-top)) 16px 12px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;text-shadow:0 2px 6px #000}
#name{font-size:24px;font-weight:800;line-height:1.2}
#time{font-size:40px;font-weight:800;line-height:1.1}
#step{font-size:17px;opacity:.85}
#count{font-size:130px;font-weight:800;line-height:.9;flex:none}
#count small{font-size:36px;opacity:.85}
#cd{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;gap:6px;text-align:center;padding:20px;background:rgba(0,0,0,.6);text-shadow:0 3px 12px #000}
#cd svg{width:120px;height:120px}
#cd .n{font-size:130px;font-weight:800;line-height:1}
#cd .x{font-size:32px;font-weight:800;line-height:1.2}
#cd .h{font-size:24px;line-height:1.3}
#cue{position:absolute;left:12px;right:12px;bottom:12px;min-height:96px;padding:20px;border-radius:18px;font:800 32px/1.2 Mukta,system-ui,sans-serif;text-align:center;background:#1f2622;display:grid;place-items:center}
#cue.good{background:var(--go)}
#cue.bad{background:var(--bad)}
#bar{display:flex;gap:10px;padding:12px 16px max(12px,env(safe-area-inset-bottom));background:#000}
#bar button{min-height:72px;border-radius:14px;border:0;font-size:22px;font-weight:800}
#flip{width:64px;flex:none;background:#2a2a2a;color:#fff;display:grid;place-items:center}
#quit{flex:1;background:#2a2a2a;color:#bbb}
#next{flex:2;background:var(--go);color:#fff}
#result{text-align:center}
#result .dcard div{text-align:left}
.badge{width:88px;height:88px;border-radius:50%;margin:24px auto 8px;display:grid;place-items:center;font-size:48px;color:#fff;background:var(--go)}
.badge.star{background:var(--sun)}
.up{background:var(--sun);color:#17201b;border-radius:16px;padding:16px;margin:16px 0;font-size:20px;font-weight:800;text-align:left}
</style>
</head>
<body>
<div id="home" class="wrap">
  <h1 id="hello"></h1>
  <div id="today" class="today"></div>
  <h2 id="h-prog"></h2>
  <div id="stats" class="stats"></div>
  <div id="chart" class="chart"></div>
  <p id="chartcap" class="soft" style="margin-top:6px"></p>
  <h2 id="h-all"></h2>
  <p id="allcap" class="soft"></p>
  <div id="list"></div>
  <h2 id="h-hist"></h2>
  <div id="hist"></div>
  <details>
    <summary id="h-set"></summary>
    <p class="soft" id="l-rounds"></p>
    <div class="row" id="rounds"></div>
    <p class="soft" id="l-lang" style="margin-top:16px"></p>
    <div class="row"><button class="btn" id="lang-en">English</button><button class="btn" id="lang-hi">हिंदी</button></div>
    <p class="soft" id="novoice" hidden></p>
  </details>
  <p class="soft" id="safety" style="margin-top:24px"></p>
</div>

<div id="place" class="wrap place" hidden></div>

<div id="cam" hidden>
  <div id="stage">
    <video id="vid" playsinline muted class="mirror"></video>
    <canvas id="cv" class="mirror"></canvas>
    <div id="hud"><div><div id="name"></div><div id="time"></div><div id="step"></div></div><div id="count"></div></div>
    <div id="cue"></div>
    <div id="cd" hidden></div>
  </div>
  <div id="bar"><button id="flip" aria-label="Flip camera"><svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 0 0-14.3-4.9L4 8M4 4v4h4M4 13a8 8 0 0 0 14.3 4.9L20 16M20 20v-4h-4"/></svg></button><button id="quit"></button><button id="next"></button></div>
</div>

<div id="result" class="wrap" hidden></div>

<script type="module">
import {PoseLandmarker,FilesetResolver} from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>"&#"+c.charCodeAt(0)+";");

// One shared link; old ?u= links still open this page and the param is ignored.
const KEY="homecoach2",GOAL=2; // GOAL: workouts a day (Mom + Dad taking turns)

// ---------- words (UI + voice) ----------
const T={
 en:{hello:"Namaste",today:"Today's workout",todayN:n=>`${n} of ${GOAL} workouts done today`,nToday:"workouts today",nWeek:"workouts this week",practice:"Practice",min:(n,k)=>`About ${n} min · ${k} sets`,start:"Start workout",doneToday:"Both workouts done today!",again:"Start another workout",prog:"Progress",streak:"day streak",chart:`Workouts per day, last 14 days. Goal: ${GOAL} a day`,all:"Exercises",allcap:"Tap In/Out to choose what goes in your workout. ▶ practises one on its own.",inW:"In",outW:"Out",level:"Level",reps:"reps",secs:"s",best:"best",hist:"History",noHist:"No workouts yet. Tap Start above.",set:"⚙ Settings",rounds:"Rounds of your exercises",lang:"Language and voice",novoice:"No Hindi voice on this phone. Install it in phone Settings → Text-to-speech.",safety:"Stop if anything hurts or you feel dizzy. The video stays on this phone.",ready:"I'm ready",back:"Back",end:"End",next:"Next ▶",last:"Finish ✓",go:"Go now",loading:"Getting ready…",fail:"Camera did not start: ",place:"Put the phone on the floor against a wall and stand 3 big steps back. No timer: tap Next when you're done with each exercise.",steps:"3 big steps",upNext:"Up next",stepOf:(i,n)=>`${i} of ${n}`,view:{side:"Turn side-on to the phone",front:"Face the phone",floor:"Get on the floor, side-on to the phone"},finished:"Workout done!",short:"Good effort. Every bit counts.",levelUp:"Level up!",keep:"Hit the target with 3 stars to level up.",finish:"Done ✓",
  cue:{low:"Sit a bit lower",chest:"Keep your chest up",straight:"Keep your body straight",bend:"Bend your arms more",higher:"Arms higher",knee:"Lift your knee higher",tall:"Stand tall",lunge:"Bend both knees more",kick:"Heels up to your bottom",climb:"Knee closer to your chest",hinge:"Bend forward more",situp:"Come up higher",wall:"Sit lower, thighs flat",hold:"Hold it",good:"Good",body:"Step back so your whole body shows",go:"Go",fin:"Target done. Keep going, or tap Next"}},
 hi:{hello:"नमस्ते",today:"आज का व्यायाम",todayN:n=>`आज ${GOAL} में से ${n} व्यायाम पूरे`,nToday:"आज के व्यायाम",nWeek:"इस हफ़्ते के व्यायाम",practice:"अभ्यास",min:(n,k)=>`करीब ${n} मिनट · ${k} सेट`,start:"व्यायाम शुरू करें",doneToday:"आज के दोनों व्यायाम पूरे!",again:"एक और व्यायाम शुरू करें",prog:"प्रगति",streak:"दिन लगातार",chart:`हर दिन के व्यायाम, पिछले 14 दिन। लक्ष्य: रोज़ ${GOAL}`,all:"व्यायाम",allcap:"अंदर/बाहर दबाकर चुनें कि व्यायाम में क्या हो। ▶ से अकेले अभ्यास करें।",inW:"अंदर",outW:"बाहर",level:"लेवल",reps:"बार",secs:"सेकंड",best:"सबसे अच्छा",hist:"इतिहास",noHist:"अभी कोई व्यायाम नहीं। ऊपर शुरू करें दबाएँ।",set:"⚙ सेटिंग",rounds:"कितने राउंड",lang:"भाषा और आवाज़",novoice:"इस फ़ोन में हिंदी आवाज़ नहीं है। फ़ोन सेटिंग → Text-to-speech में डालें।",safety:"दर्द या चक्कर हो तो तुरंत रुकें। वीडियो इसी फ़ोन में रहता है।",ready:"मैं तैयार हूँ",back:"वापस",end:"बंद करें",next:"अगला ▶",last:"पूरा ✓",go:"अभी शुरू",loading:"तैयारी हो रही है…",fail:"कैमरा शुरू नहीं हुआ: ",place:"फ़ोन को दीवार के सहारे ज़मीन पर रखें और 3 बड़े कदम पीछे खड़े हों। कोई टाइमर नहीं: हर व्यायाम के बाद अगला दबाएँ।",steps:"3 बड़े कदम",upNext:"अगला",stepOf:(i,n)=>`${n} में से ${i}`,view:{side:"फ़ोन की ओर बगल से खड़े हों",front:"फ़ोन की ओर मुँह करें",floor:"ज़मीन पर, फ़ोन की ओर बगल से"},finished:"व्यायाम पूरा!",short:"अच्छी कोशिश। हर थोड़ा मायने रखता है।",levelUp:"अगला लेवल!",keep:"अगले लेवल के लिए लक्ष्य 3 सितारों से पूरा करें।",finish:"हो गया ✓",
  cue:{low:"थोड़ा और नीचे बैठिए",chest:"सीना ऊपर रखिए",straight:"शरीर सीधा रखिए",bend:"बाहें और मोड़िए",higher:"हाथ और ऊपर",knee:"घुटना और ऊपर उठाइए",tall:"सीधे खड़े रहिए",lunge:"दोनों घुटने और मोड़िए",kick:"एड़ी पीछे तक लाइए",climb:"घुटना सीने के और पास",hinge:"और आगे झुकिए",situp:"और ऊपर आइए",wall:"और नीचे, जांघें सीधी",hold:"ऐसे ही रुकिए",good:"बढ़िया",body:"थोड़ा पीछे जाइए, पूरा शरीर दिखना चाहिए",go:"शुरू",fin:"लक्ष्य पूरा। चलते रहिए या अगला दबाएँ"}}
};
const DAYS={en:["S","M","T","W","T","F","S"],hi:["र","सो","मं","बु","गु","शु","श"]};

// ---------- stick figures (72x72) ----------
const FLOOR=`<path class="prop" d="M4 64H68"/>`;
const FIG={
 march:`<circle class="hd" cx="36" cy="12" r="6"/><path d="M36 19V62M36 40H51V57M36 25L27 37M36 25L45 35"/>`,
 kick:`<circle class="hd" cx="36" cy="12" r="6"/><path d="M36 19V62M36 40L40 52L28 46M36 25L27 37M36 25L45 35"/>`,
 jacks:`<circle class="hd" cx="36" cy="13" r="6"/><path d="M36 20V42L22 62M36 42L50 62M36 25L22 7M36 25L50 7"/>`,
 squat:`<circle class="hd" cx="40" cy="14" r="6"/><path d="M38 21L30 40L46 44L44 62M37 27L56 30"/>`,
 lunge:FLOOR+`<circle class="hd" cx="36" cy="10" r="6"/><path d="M36 17V40L50 48V62M36 40L26 52L14 60M36 24V38"/>`,
 hinge:`<circle class="hd" cx="60" cy="21" r="6"/><path d="M34 38V62M34 38L54 26M54 26L48 20"/>`,
 wall:`<path class="prop" d="M18 4V66"/><circle class="hd" cx="27" cy="12" r="6"/><path d="M26 19V40H46V62M26 25L40 32"/>`,
 push:`<path class="prop" d="M60 6V66"/><circle class="hd" cx="46" cy="16" r="6"/><path d="M43 23L24 62M41 27L50 34L60 30"/>`,
 dip:`<path class="prop" d="M6 44H26M9 44V64M23 44V64"/><circle class="hd" cx="36" cy="14" r="6"/><path d="M36 21V46H56L58 64M36 26L26 34L22 44"/>`,
 climb:FLOOR+`<circle class="hd" cx="10" cy="28" r="6"/><path d="M16 32L42 38L64 58M42 38L32 50L42 58M20 34V60"/>`,
 plank:FLOOR+`<circle class="hd" cx="10" cy="38" r="6"/><path d="M16 42L66 58M20 44V58H30"/>`,
 situp:FLOOR+`<circle class="hd" cx="18" cy="30" r="6"/><path d="M22 37L34 60L46 44L58 60M22 40L36 44"/>`
};
const fig=id=>`<svg class="fig" viewBox="0 0 72 72" width="72" height="72" aria-hidden="true">${FIG[id]}</svg>`;

// ---------- geometry ----------
let AR=1;
const ang=(a,b,c)=>{const v1=[(a.x-b.x)*AR,a.y-b.y],v2=[(c.x-b.x)*AR,c.y-b.y];const d=(v1[0]*v2[0]+v1[1]*v2[1])/(Math.hypot(...v1)*Math.hypot(...v2)||1);return Math.acos(Math.max(-1,Math.min(1,d)))*180/Math.PI};
// 3D angle on world landmarks (metres): works whichever way the person faces.
const ang3=(a,b,c)=>{const u=[a.x-b.x,a.y-b.y,a.z-b.z],v=[c.x-b.x,c.y-b.y,c.z-b.z];const d=(u[0]*v[0]+u[1]*v[1]+u[2]*v[2])/(Math.hypot(...u)*Math.hypot(...v)||1);return Math.acos(Math.max(-1,Math.min(1,d)))*180/Math.PI};
const lean=(s,h)=>Math.abs(Math.atan2((s.x-h.x)*AR,h.y-s.y)*180/Math.PI);
// Pick the side facing the camera; right landmark = left + 1.
const side=(lm,Ls)=>{const Rs=Ls.map(i=>i+1),v=a=>a.reduce((s,i)=>s+(lm[i].visibility??1),0);return(v(Ls)>=v(Rs)?Ls:Rs).map(i=>lm[i])};
// Visible = confident AND inside the frame (visibility can be high for off-screen points).
const ok=p=>(p.visibility??1)>.5&&p.x>-.02&&p.x<1.02&&p.y>-.02&&p.y<1.02;
const vis=(lm,ex)=>ex.need.every(i=>ok(lm[i]))||(ex.sideOn&&ex.need.every(i=>ok(lm[i+1])));
// Lowest hip / knee angle of the two legs, 3D when world landmarks exist.
const both=(lm,w,a,b,c)=>w?Math.min(ang3(w[a],w[b],w[c]),ang3(w[a+1],w[b+1],w[c+1])):Math.min(ang(lm[a],lm[b],lm[c]),ang(lm[a+1],lm[b+1],lm[c+1]));
const L2=(en,hi,n)=>[en,hi,n];

// ---------- exercises ----------
// Reps: leave rest, pass `act` (counted), come back to rest. Not reaching `ideal` = counted but flagged with `endCue`.
// low=true: the angle drops during the move (squat); false: it rises (jacks).
// Holds (`hold`): seconds count only while hold(lm) is true. Targets are in seconds.
// levels: [English, Hindi, target]. Pitched at fit-enough people in their 40s.
const EX=[
 {id:"march",view:"side",sideOn:true,need:[11,23,25],en:"High knees",hi:"ऊँचे घुटने",
  tip:{en:"March or jog on the spot, knees up to hip height.",hi:"एक जगह मार्च या जॉग, घुटने कमर तक।"},
  levels:[L2("March","मार्च",30),L2("Brisk march","तेज़ मार्च",40),L2("Brisk march","तेज़ मार्च",50),L2("High-knee jog","घुटने ऊपर जॉग",50),L2("High-knee jog","घुटने ऊपर जॉग",60),L2("High-knee jog","घुटने ऊपर जॉग",80)],
  // ponytail: one state machine on the higher knee; fast jogging can merge two lifts. Per-leg machines if it undercounts.
  low:true,rest:150,act:140,ideal:125,endCue:"knee",
  metric:(lm,w)=>both(lm,w,11,23,25),
  live:lm=>lean(lm[11],lm[23])>25?"tall":null},

const EXM=Object.fromEntries(EX.map(e=>[e.id,e]));
const DEFAULT_ON=["march","squat","push","jacks","lunge","plank","climb"];

// ---------- storage ----------
let S=null;try{S=JSON.parse(localStorage.getItem(KEY))}catch{}
if(!S){
 // Merge the old per-person stores (homecoach2:mom, homecoach2:dad): every session and set kept, highest level wins.
 for(const k of Object.keys(localStorage).filter(k=>k.startsWith(KEY+":"))){try{const o=JSON.parse(localStorage[k]);
  S??={lang:o.lang,data:{},sessions:[]};S.on??=o.on;S.rounds??=o.rounds;S.sessions.push(...(o.sessions||[]));
  for(const[id,q]of Object.entries(o.data||{})){const p=S.data[id]??={level:0,log:[]};p.level=Math.max(p.level,q.level||0);p.log.push(...(q.log||[]))}}catch{}}
}
if(!S){
 // Oldest version: Mom/Dad inside one store. Take the person last selected.
 try{const o=JSON.parse(localStorage.getItem("homecoach1"));if(o.data[o.who])S={lang:o.lang,data:o.data[o.who]}}catch{}
}
if(!S||typeof S.data!="object"||!S.data||!T[S.lang])S={lang:S?.lang in T?S.lang:"en",data:{}};
S.on=(S.on||DEFAULT_ON).filter(id=>EXM[id]);if(!S.on.length)S.on=[...DEFAULT_ON];
S.rounds=[1,2,3].includes(S.rounds)?S.rounds:2;
S.sessions??=[];
// Each session lists what was done in it. Older sessions didn't: attach the sets saved within 5 s of them,
// and turn sets with no session into one entry per day.
if(S.v!=3){
 const logs=Object.entries(S.data).flatMap(([id,p])=>p.log.map(l=>({...l,id}))),row=l=>(l.used=1,{id:l.id,reps:l.reps,good:l.good});
 for(const x of S.sessions)x.ex??=logs.filter(l=>!l.used&&Math.abs(l.t-x.t)<5000).map(row);
 const byDay={};for(const l of logs)if(!l.used)(byDay[l.d]??=[]).push(l);
 for(const[d,ls]of Object.entries(byDay))S.sessions.push({d,t:Math.max(...ls.map(l=>l.t)),secs:0,ex:ls.map(row)});
 S.v=3;
}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch{}};
navigator.storage?.persist?.().catch(()=>{});
save(); // keep the merged/migrated store
const L=()=>T[S.lang];
const prog=id=>S.data[id]??={level:0,log:[]};
const lvl=e=>{const p=prog(e.id),x=e.levels[Math.min(p.level,e.levels.length-1)];return{name:S.lang=="hi"?x[1]:x[0],reps:x[2],n:p.level+1}};
const unit=e=>e.hold?L().secs:L().reps;
// Local date, not UTC: a 5 a.m. IST workout belongs to today.
const ymd=ms=>{const t=new Date(ms);t.setMinutes(t.getMinutes()-t.getTimezoneOffset());return t.toISOString().slice(0,10)};
const today=()=>ymd(Date.now());
const stars=(g,r)=>!r?0:g/r>=.8?3:g/r>=.5?2:1;
const plan=()=>[...Array(S.rounds)].flatMap(()=>EX.filter(e=>S.on.includes(e.id)).map(e=>e.id));

loadVoices();try{speechSynthesis.addEventListener("voiceschanged",()=>{loadVoices();if(!$("home").hidden)home()})}catch{}

function show(id){for(const s of["home","place","cam","result"])$(s).hidden=s!=id;scrollTo(0,0)}
function home(){
 show("home");const t=L();document.documentElement.lang=S.lang;
 $("hello").textContent=t.hello;
 const days=new Set(S.sessions.map(s=>s.d)),p=plan();
 // A workout counts toward the daily goal; single-exercise practice (w:false) does not. Old sessions have no flag and count.
 const nOn=day=>S.sessions.filter(s=>s.d==day&&s.w!==false).length,n=nOn(today());
 // ponytail: ~70 s per set (work + getting into position); measure real sessions if this is far off.
 $("today").innerHTML=`<div class="lab">${n>=GOAL?t.doneToday:t.today}</div><div class="what">${t.min(Math.round(p.length*70/60),p.length)}</div><div class="figs">${[...new Set(p)].map(fig).join("")}</div><div class="goal">${[...Array(Math.max(GOAL,n))].map((_,i)=>`<i class="${i<n?"on":""}"></i>`).join("")}<span>${t.todayN(n)}</span></div><button id="go">${n?t.again:t.start}</button>`;
 $("go").onclick=()=>place(p);
 // Progress: streak counts back from today (or yesterday, so the streak isn't 0 before today's workout).
 const DAY=864e5;let streak=0,d=Date.now();if(!days.has(ymd(d)))d-=DAY;while(days.has(ymd(d))){streak++;d-=DAY}
 const wk=[...Array(7)].map((_,i)=>ymd(Date.now()-i*DAY));
 $("h-prog").textContent=t.prog;
 $("stats").innerHTML=[[`${n}/${GOAL}`,t.nToday],[streak,t.streak],[wk.reduce((a,x)=>a+nOn(x),0),t.nWeek]].map(([n,l])=>`<div class="stat"><b>${n}</b><span>${l}</span></div>`).join("");
 const last14=[...Array(14)].map((_,i)=>{const ms=Date.now()-(13-i)*DAY;return{m:nOn(ymd(ms)),dn:new Date(ms).getDay(),now:i==13}}),top=Math.max(GOAL,...last14.map(x=>x.m));
 // Days under the goal get a pale bar.
 $("chart").innerHTML=last14.map(x=>`<div class="${x.now?"now":""}">${x.m?`<small>${x.m}</small>`:""}<i class="${!x.m?"z":x.m<GOAL?"h":""}" style="height:${x.m/top*70}%"></i><span>${DAYS[S.lang][x.dn]}</span></div>`).join("");
 $("chartcap").textContent=t.chart;
 $("h-all").textContent=t.all;$("allcap").textContent=t.allcap;$("h-hist").textContent=t.hist;$("h-set").textContent=t.set;
 $("list").innerHTML=EX.map(e=>{const l=lvl(e),on=S.on.includes(e.id),best=Math.max(0,...prog(e.id).log.map(x=>x.reps));
  return `<div class="ex ${on?"":"off"}">${fig(e.id)}<span><b>${esc(e[S.lang])}</b><span class="soft">${l.reps} ${unit(e)}${l.name==e[S.lang]?"":" · "+esc(l.name)}</span><span class="soft"><span class="pill">${t.level} ${l.n}</span>${best?` ${t.best} ${best}`:""}</span></span><button class="tog ${on?"on":""}" data-t="${e.id}">${on?"✓ "+t.inW:t.outW}</button><button class="play" data-e="${e.id}" aria-label="${esc(e[S.lang])}">▶</button></div>`}).join("");
 // History: every session, newest first. Sessions rebuilt from old sets have secs:0 and show no time.
 const loc=S.lang=="hi"?"hi-IN":"en-IN";
 $("hist").innerHTML=[...S.sessions].sort((a,b)=>b.t-a.t).slice(0,20).map(x=>{const when=new Date(x.secs?x.t:Date.parse(x.d+"T12:00")),m=Math.round(x.secs/60);
  return `<div class="dcard"><b>${when.toLocaleDateString(loc,{weekday:"short",day:"numeric",month:"short"})}${x.secs?" · "+when.toLocaleTimeString(loc,{hour:"numeric",minute:"2-digit"}):""}${m?` · ${m} min`:""}${x.w===false?` · ${t.practice}`:""}</b>${x.ex.filter(r=>EXM[r.id]).map(r=>`<div><span>${esc(EXM[r.id][S.lang])}</span><span>${r.reps} ${unit(EXM[r.id])} <span class="st">${"★".repeat(stars(r.good,r.reps))}</span></span></div>`).join("")}</div>`}).join("")||`<p class="soft">${t.noHist}</p>`;
 $("l-rounds").textContent=t.rounds;
 $("rounds").innerHTML=[1,2,3].map(n=>`<button class="btn ${S.rounds==n?"on":""}" data-r="${n}">${n}</button>`).join("");
 $("lang-en").className="btn"+(S.lang=="en"?" on":"");$("lang-hi").className="btn"+(S.lang=="hi"?" on":"");
 $("novoice").textContent=t.novoice;$("novoice").hidden=!(S.lang=="hi"&&!hv);
 $("l-lang").textContent=t.lang;
 $("safety").textContent=t.safety;
}

 const w=W={ids,i:0,cd:0,t0:0,done:[],iv:0};
 run=mkRun(ids[0]);
 $("quit").textContent=t.end;$("next").textContent=ids.length>1?t.next:t.last;
 $("name").textContent="";$("time").textContent="";$("step").textContent="";$("count").textContent="";$("cd").hidden=true;cue(t.loading);
 try{await Promise.all([getModel(),openCam()])}catch(err){if(W===w)cue(t.fail+err.message,"bad");return}
 // Ended while loading: don't leave the camera on.
 if(W!==w){stream?.getTracks().forEach(x=>x.stop());stream=null;return}
 w.t0=Date.now();history.pushState(1,"");wake();tick(++loop);intro(true);
 w.iv=setInterval(second,1000);
}
// Short "up next" screen, then counting starts by itself. Next skips the wait.
function intro(first){
 const t=L(),w=W,ex=run.ex,l=lvl(ex);
 w.cd=first?10:8;run.live=false;
 $("name").textContent=ex[S.lang];showCount(run);$("step").textContent=t.stepOf(w.i+1,w.ids.length);
 $("next").textContent=t.go;
 $("cd").hidden=false;
 $("cd").innerHTML=`<div class="h">${t.upNext}</div>${fig(ex.id)}<div class="x">${esc(ex[S.lang])}${l.name==ex[S.lang]?"":"<br>"+esc(l.name)}</div><div class="h">${run.target} ${unit(ex)} · ${t.view[ex.view]}</div><div class="n" id="cdn">${w.cd}</div>`;
 cue(ex.tip[S.lang]);
 say(`${ex[S.lang]}. ${t.view[ex.view]}.`,true);
}
function go(){
 const w=W,t=L();w.cd=0;$("cd").hidden=true;run.live=true;
 $("next").textContent=w.i==w.ids.length-1?t.last:t.next;
 say(cue("go"),true);
}
function second(){
 const w=W;if(!w)return;
 $("time").textContent=clock(Math.floor((Date.now()-w.t0)/1000));
 if(!w.cd)return;
 w.cd--;if($("cdn"))$("cdn").textContent=w.cd;
 if(w.cd>0&&w.cd<=3)say(String(w.cd),true);
 if(!w.cd)go();
}
$("next").onclick=()=>{
 const w=W;if(!w||!w.t0)return;
 if(w.cd)return go();
 w.done.push(run);w.i++;
 if(w.i>=w.ids.length)return finish();
 run=mkRun(w.ids[w.i]);intro(false);
};

const BONES=[[11,12],[11,13],[13,15],[12,14],[14,16],[11,23],[12,24],[23,24],[23,25],[25,27],[24,26],[26,28]];
function draw(lm,color){
 const c=$("cv"),v=$("vid"),x=c.getContext("2d");
 if(c.width!=v.videoWidth||c.height!=v.videoHeight){c.width=v.videoWidth;c.height=v.videoHeight}
 x.clearRect(0,0,c.width,c.height);if(!lm)return;
 x.lineWidth=7;x.lineCap="round";x.strokeStyle=color;x.fillStyle="#fff";
 for(const[a,b]of BONES){x.beginPath();x.moveTo(lm[a].x*c.width,lm[a].y*c.height);x.lineTo(lm[b].x*c.width,lm[b].y*c.height);x.stroke()}
 for(const i of[11,12,13,14,15,16,23,24,25,26,27,28]){x.beginPath();x.arc(lm[i].x*c.width,lm[i].y*c.height,6,0,7);x.fill()}
}
// One detection per new camera frame (requestVideoFrameCallback), rAF where unsupported.
// `g` retires the loop from an earlier workout: its pending frame callback would otherwise run a second loop.
function tick(g){
 if(!W||g!=loop)return;const v=$("vid");
 if(v.readyState>=2&&landmarker){
  AR=v.videoWidth/v.videoHeight;
  try{const r=landmarker.detectForVideo(v,performance.now());step(r.landmarks?.[0],r.worldLandmarks?.[0])}
  catch(e){
   // GPU delegate can die mid-session on some phones: rebuild on CPU once.
   if(delegate=="GPU"){delegate="CPU";const old=landmarker;landmarker=null;try{old.close()}catch{}getModel().catch(()=>cue(L().fail+e.message,"bad"))}
  }
 }
 const nx=()=>tick(g);v.requestVideoFrameCallback?v.requestVideoFrameCallback(nx):requestAnimationFrame(nx);
}
function step(lm,w){
 const R=run,ex=R.ex,now=performance.now(),dt=R.lt?Math.min((now-R.lt)/1000,.25):0;R.lt=now;
 if(!lm||!vis(lm,ex)){
  draw(lm,"#888");
  // Only react after ~20 lost frames, so one bad frame doesn't reset or nag.
  if(++R.lost>=20){R.smooth=null;R.inN=0;if(R.state=="move")R.state="rest";if(R.live)say(cue("body"))}
  return;
 }
 if(R.lost>=20)cue(ex.tip[S.lang]);R.lost=0;
 if(ex.hold){
  const inPos=ex.hold(lm);R.inN=inPos?R.inN+1:0;R.outN=inPos?0:R.outN+1;
  draw(lm,R.inN>=5?"#0a8f5a":"#888");
  if(!R.live)return;
  if(R.inN>=5){
   const was=Math.floor(R.secs);R.secs+=dt;const s=Math.floor(R.secs);
   if(s!=was){R.reps=R.good=s;showCount(R);cue("hold","good");if(s==R.target)say(L().cue.fin,true);else if(s%10==0)say(String(s),true)}
  }else if(R.outN>=30)say(cue(ex.endCue,"bad"));
  return;
 }
 const raw=ex.metric(lm,w);R.smooth=R.smooth==null?raw:R.smooth*.6+raw*.4;const m=R.smooth;
 draw(lm,R.state=="move"&&R.bad?"#d9480f":"#0a8f5a");
 if(!R.live)return;
 const past=(a,b)=>ex.low?a<b:a>b;
 if(R.state=="rest"&&past(m,ex.low?ex.rest-8:ex.rest+8)){R.state="move";R.ext=m;R.bad=false;R.liveN=0;R.why=null}
 if(R.state!="move")return;
 R.ext=ex.low?Math.min(R.ext,m):Math.max(R.ext,m);
 // A form fault must hold 5 frames before it marks the rep.
 const f=ex.live(lm);R.liveN=f?R.liveN+1:0;
 if(R.liveN>=5&&!R.bad){R.bad=true;R.why=f;say(cue(f,"bad"))}
 if(!past(ex.rest,m))return; // not back at rest yet
 R.state="rest";
 if(!past(R.ext,ex.act)){say(cue(ex.endCue,"bad"));return} // too small to count
 if(!past(R.ext,ex.ideal)){R.bad=true;R.why??=ex.endCue}
 R.reps++;if(!R.bad)R.good++;
 showCount(R);
 cue(R.bad?R.why:"good",R.bad?"bad":"good");
 if(R.reps==R.target)say(L().cue.fin,true);
 // Fast moves (jacks, high knees): just the number, a full phrase each rep would pile up.
 else say(R.target>20?String(R.reps):R.reps+". "+L().cue[R.bad?R.why:"good"],true);
}
function stopCam(){const w=W;W=null;if(w)clearInterval(w.iv);stream?.getTracks().forEach(t=>t.stop());stream=null;try{wl?.release()}catch{}wl=null;try{speechSynthesis.cancel()}catch{}return w}
$("quit").onclick=()=>{const w=W;if(!w)return;if(!w.cd&&run.reps>0)w.done.push(run);finish()};
$("flip").onclick=async()=>{facing=facing=="user"?"environment":"user";try{await openCam()}catch(e){cue(L().fail+e.message,"bad")}};

// ---------- result ----------
function finish(){
 const w=stopCam();if(!w)return;const t=L();
 const per={};
 for(const R of w.done){if(!R.reps)continue;prog(R.ex.id).log.push({d:today(),t:Date.now(),reps:R.reps,good:R.good,level:R.level});
  const x=per[R.ex.id]??={ex:R.ex,reps:0,good:0,target:0,all:true};x.reps+=R.reps;x.good+=R.good;x.target+=R.target;
  if(R.reps<R.target||stars(R.good,R.reps)<3)x.all=false}
 // Log every real attempt: any reps counted, or a minute or more spent (camera may have missed the reps).
 const secs=w.t0?Math.round((Date.now()-w.t0)/1000):0;
 if(w.t0&&(w.done.some(R=>R.reps)||secs>=60))S.sessions.push({d:today(),t:Date.now(),secs:Math.round((Date.now()-w.t0)/1000),w:w.ids.length>1,ex:Object.values(per).map(x=>({id:x.ex.id,reps:x.reps,good:x.good}))});
 // Level up when every set of that exercise hit its target with 3 stars.
 const ups=[];
 for(const x of Object.values(per)){const p=prog(x.ex.id);if(x.all&&p.level<x.ex.levels.length-1){p.level++;ups.push(x.ex)}}
 save();
 const full=w.i>=w.ids.length;show("result");
 $("result").innerHTML=`<div class="badge ${ups.length?"star":""}">${ups.length?"★":"✓"}</div><h1>${full?t.finished:t.short}</h1>
 ${w.t0?`<p class="soft">${clock(Math.round((Date.now()-w.t0)/1000))}</p>`:""}
 <div class="dcard">${Object.values(per).map(x=>`<div><span>${esc(x.ex[S.lang])}</span><span>${x.reps}/${x.target} ${unit(x.ex)} <span class="st">${"★".repeat(stars(x.good,x.reps))}</span></span></div>`).join("")||`<p class="soft">—</p>`}</div>
 ${ups.length?`<div class="up">${t.levelUp}<br>${ups.map(e=>`${esc(e[S.lang])}: ${esc(lvl(e).name)}, ${lvl(e).reps} ${unit(e)}`).join("<br>")}</div>`:`<p style="margin:16px 0">${t.keep}</p>`}
 <button class="big" id="back">${t.finish}</button>`;
 say(ups.length?t.levelUp:t.finished,true);
 $("back").onclick=home;
}
home();
</script>
</body>
