<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Home Coach</title>
<style>
:root{--bg:#fbfaf7;--ink:#17201b;--soft:#5b665f;--line:#dfe3dd;--go:#0a8f5a;--warn:#e0611a;--card:#fff}
@media(prefers-color-scheme:dark){:root{--bg:#101512;--ink:#eef2ee;--soft:#9aa59e;--line:#2a332d;--card:#18201b}}
*{box-sizing:border-box;min-width:0}
[hidden]{display:none!important}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:17px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:560px;margin:0 auto;padding:max(16px,env(safe-area-inset-top)) 16px 32px}
h1{font-size:34px;line-height:1.05;letter-spacing:-.02em;margin:8px 0 4px}
h2{font-size:22px;margin:24px 0 8px}
p{margin:4px 0}
.soft{color:var(--soft);font-size:15px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
button{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:12px 16px;min-height:48px;cursor:pointer}
button.on{background:var(--go);border-color:var(--go);color:#fff}
button.big{width:100%;font-size:20px;font-weight:700;background:var(--go);color:#fff;border:0;min-height:60px}
.ex{display:grid;grid-template-columns:1fr auto;gap:4px 12px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:10px 0;width:100%;text-align:left}
.ex b{font-size:20px}
.lvl{grid-row:span 2;align-self:center;text-align:center;font-weight:800;color:var(--go);font-size:28px;line-height:1}
.lvl small{display:block;font-size:12px;font-weight:600;color:var(--soft)}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:8px 0}
.day{aspect-ratio:1;border-radius:10px;background:var(--line);display:grid;place-items:center;font-size:13px;color:var(--soft)}
.day.done{background:var(--go);color:#fff;font-weight:700}
#cam{position:fixed;inset:0;background:#000;display:flex;flex-direction:column}
#stage{position:relative;flex:1;overflow:hidden}
#stage video,#stage canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.mirror{transform:scaleX(-1)}
#hud{position:absolute;left:0;right:0;top:0;padding:max(12px,env(safe-area-inset-top)) 16px 12px;display:flex;justify-content:space-between;align-items:flex-start;color:#fff;text-shadow:0 1px 4px #000}
#count{font-size:84px;font-weight:800;line-height:1}
#count small{font-size:28px;opacity:.8}
#cue{position:absolute;left:12px;right:12px;bottom:12px;padding:14px 16px;border-radius:14px;font-size:24px;font-weight:700;text-align:center;background:rgba(0,0,0,.6);color:#fff}
#cue.good{background:rgba(10,143,90,.85)}
#cue.bad{background:rgba(224,97,26,.9)}
#bar{display:flex;gap:8px;padding:12px 16px max(12px,env(safe-area-inset-bottom));background:#000}
#bar button{flex:1;background:#222;color:#fff;border-color:#333}
#bar #done{background:var(--go);border-color:var(--go);font-weight:700}
.res{font-size:64px;font-weight:800;color:var(--go);line-height:1}
.hist{width:100%;border-collapse:collapse;font-size:15px}
.hist td{padding:8px 4px;border-bottom:1px solid var(--line)}
.up{background:var(--go);color:#fff;border-radius:14px;padding:14px 16px;margin:12px 0;font-weight:700}
</style>
</head>
<body>
<div id="home" class="wrap">
  <h1>Home Coach</h1>
  <p class="soft">Who is exercising?</p>
  <div id="people" class="row" style="margin:8px 0"></div>
  <div id="week" class="week"></div>
  <div id="list"></div>
  <h2>Settings</h2>
  <div class="row">
    <span class="soft">Voice</span>
    <button id="lang-en">English</button><button id="lang-hi">हिंदी</button>
    <button id="rename">Rename person</button>
  </div>
  <h2>History</h2>
  <table class="hist"><tbody id="hist"></tbody></table>
  <p class="soft" style="margin-top:20px">Stop if anything hurts or you feel dizzy. Video stays on this phone.</p>
</div>

<div id="cam" hidden>
  <div id="stage">
    <video id="vid" playsinline muted class="mirror"></video>
    <canvas id="cv" class="mirror"></canvas>
    <div id="hud"><div style="max-width:calc(100% - 130px)"><div id="name" style="font-weight:700;font-size:20px"></div><div id="tip" style="font-size:15px"></div></div><div id="count">0<small>/0</small></div></div>
    <div id="cue">Loading…</div>
  </div>
  <div id="bar"><button id="flip">Flip camera</button><button id="quit">Cancel</button><button id="done">Done</button></div>
</div>

<div id="result" class="wrap" hidden></div>

<script type="module">
import {PoseLandmarker,FilesetResolver} from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";
const $=id=>document.getElementById(id);

// Angle at b (degrees) between a-b-c; x scaled by aspect so angles match the real body.
let AR=1;
const ang=(a,b,c)=>{const v1=[(a.x-b.x)*AR,a.y-b.y],v2=[(c.x-b.x)*AR,c.y-b.y];const d=(v1[0]*v2[0]+v1[1]*v2[1])/(Math.hypot(...v1)*Math.hypot(...v2)||1);return Math.acos(Math.max(-1,Math.min(1,d)))*180/Math.PI};
// Lean of the shoulder-hip line from vertical.
const lean=(s,h)=>Math.abs(Math.atan2((s.x-h.x)*AR,h.y-s.y)*180/Math.PI);
// Pick the side the camera sees best (side views hide one side).
const side=(lm,L,R)=>L.reduce((a,i)=>a+(lm[i].visibility??1),0)>=R.reduce((a,i)=>a+(lm[i].visibility??1),0)?L.map(i=>lm[i]):R.map(i=>lm[i]);
const vis=(lm,ids)=>ids.every(i=>(lm[i].visibility??1)>.5);

const T={
 en:{low:"Go a bit lower",chest:"Keep your chest up",straight:"Keep your body straight",bend:"Bend your arms more",arms:"Straighten your arms",even:"Raise both arms evenly",knee:"Lift your knee higher",tall:"Stand tall",good:"Good",body:"Step back so your whole body shows",start:"Start when ready",level:"Level up!"},
 hi:{low:"थोड़ा और नीचे जाइए",chest:"सीना ऊपर रखिए",straight:"शरीर सीधा रखिए",bend:"बाहें और मोड़िए",arms:"बाहें सीधी रखिए",even:"दोनों हाथ बराबर उठाइए",knee:"घुटना और ऊपर उठाइए",tall:"सीधे खड़े रहिए",good:"बढ़िया",body:"थोड़ा पीछे जाइए, पूरा शरीर दिखना चाहिए",start:"तैयार हों तो शुरू कीजिए",level:"अगला लेवल!"}
};

// rest/act: thresholds on the tracked angle. A rep = rest -> active -> rest.
// low=true means the angle drops when active (squat), false means it rises (arm raise).
const EX=[
 {id:"squat",name:"Chair squat",need:[23,25,27],tip:"Side-on to the camera. Chair behind you. Sit down slowly, stand up.",
  levels:[["Sit to stand, hands on knees",6],["Sit to stand",8],["Sit to stand",10],["Chair tap, don't sit",10],["Chair tap, don't sit",12],["Chair tap, slow down",15]],
  low:true,rest:160,act:115,
  metric:lm=>{const[h,k,a]=side(lm,[23,25,27],[24,26,28]);return ang(h,k,a)},
  live:lm=>{const[s,h]=side(lm,[11,23],[12,24]);return lean(s,h)>50?"chest":null},
  end:x=>x>125?"low":null},
 {id:"push",name:"Wall push-up",need:[11,13,15,23,27],tip:"Side-on. Hands on the wall at shoulder height, feet back.",
  levels:[["Wall push-up",6],["Wall push-up",10],["Wall push-up, feet further back",10],["Kitchen counter push-up",8],["Kitchen counter push-up",12],["Knee push-up on the floor",8]],
  low:true,rest:150,act:105,
  metric:lm=>{const[s,e,w]=side(lm,[11,13,15],[12,14,16]);return ang(s,e,w)},
  live:lm=>{const[s,h,a]=side(lm,[11,23,27],[12,24,28]);return ang(s,h,a)<155?"straight":null},
  end:x=>x>120?"bend":null},
 {id:"raise",name:"Arm raise",need:[11,12,13,14,15,16,23,24],tip:"Face the camera. Raise both arms out and up over your head.",
  levels:[["Arm raise",8],["Arm raise",12],["Arm raise",15],["Arm raise, hold 2 s at top",10],["Holding water bottles",10],["Holding water bottles",15]],
  low:false,rest:45,act:150,
  metric:lm=>Math.min(ang(lm[23],lm[11],lm[15]),ang(lm[24],lm[12],lm[16])),
  live:lm=>{const l=ang(lm[23],lm[11],lm[15]),r=ang(lm[24],lm[12],lm[16]);if(Math.max(l,r)>70&&Math.abs(l-r)>30)return"even";if(Math.max(l,r)>90&&Math.min(ang(lm[11],lm[13],lm[15]),ang(lm[12],lm[14],lm[16]))<140)return"arms";return null},
  end:()=>null},
 {id:"march",name:"Knee raise march",need:[11,23,25,24,26],tip:"Side-on or facing. March on the spot, lift each knee up. Hold a chair if needed.",
  levels:[["Holding a chair",10],["Holding a chair",16],["No chair",16],["No chair",24],["Hold each knee up 1 s",20],["Faster march",30]],
  low:true,rest:160,act:125,
  metric:lm=>Math.min(ang(lm[11],lm[23],lm[25]),ang(lm[12],lm[24],lm[26])),
  live:lm=>lean(lm[11],lm[23])>25?"tall":null,
  end:x=>x>110?"knee":null}
];

// Storage: one record per person. localStorage can throw (private mode): the app still runs, just forgets.
const KEY="homecoach1";
let S;try{S=JSON.parse(localStorage.getItem(KEY))}catch{}
S=S||{people:["Mom","Dad"],who:0,lang:"en",data:[{},{}]};
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch{}};
const me=()=>{S.data[S.who]??={};return S.data[S.who]};
const prog=id=>{const d=me();d[id]??={level:0,log:[]};return d[id]};
const esc=s=>String(s).replace(/[&<>"']/g,c=>"&#"+c.charCodeAt(0)+";");
// Local date, not UTC: a 5 a.m. IST workout belongs to today.
const ymd=ms=>{const t=new Date(ms);t.setMinutes(t.getMinutes()-t.getTimezoneOffset());return t.toISOString().slice(0,10)};
const today=()=>ymd(Date.now());

function home(){
 $("home").hidden=false;$("cam").hidden=true;$("result").hidden=true;
 $("people").innerHTML=S.people.map((p,i)=>`<button data-p="${i}" class="${i==S.who?"on":""}">${esc(p)}</button>`).join("");
 $("lang-en").className=S.lang=="en"?"on":"";$("lang-hi").className=S.lang=="hi"?"on":"";
 const all=EX.flatMap(e=>prog(e.id).log.map(l=>({...l,e})));
 const days=new Set(all.map(l=>l.d));
 $("week").innerHTML=[...Array(7)].map((_,i)=>{const t=new Date(Date.now()-(6-i)*864e5),k=ymd(t);return `<div class="day ${days.has(k)?"done":""}">${"SMTWTFS"[t.getDay()]}</div>`}).join("");
 $("list").innerHTML=EX.map(e=>{const p=prog(e.id),L=e.levels[Math.min(p.level,e.levels.length-1)],last=p.log.at(-1);
  return `<button class="ex" data-e="${e.id}"><b>${e.name}</b><span class="lvl">${p.level+1}<small>level</small></span><span class="soft">${L[0]} · ${L[1]} reps${last?` · last ${last.reps} (${Math.round(last.good/Math.max(last.reps,1)*100)}% good)`:""}</span></button>`}).join("");
 $("hist").innerHTML=all.sort((a,b)=>b.t-a.t).slice(0,10).map(l=>`<tr><td>${l.d.slice(5)}</td><td>${l.e.name}</td><td>${l.reps} reps</td><td>${Math.round(l.good/Math.max(l.reps,1)*100)}% good</td></tr>`).join("")||`<tr><td class="soft">No workouts yet. Pick one above.</td></tr>`;
}
$("people").onclick=e=>{const b=e.target.closest("[data-p]");if(b){S.who=+b.dataset.p;save();home()}};
$("lang-en").onclick=()=>{S.lang="en";save();home()};
$("lang-hi").onclick=()=>{S.lang="hi";save();home()};
$("rename").onclick=()=>{const b=$("people").querySelector(".on");const n=window.prompt("New name",S.people[S.who]);if(n&&n.trim()){S.people[S.who]=n.trim().slice(0,20);save();home()}};
$("list").onclick=e=>{const b=e.target.closest("[data-e]");if(b)start(EX.find(x=>x.id==b.dataset.e))};

// Voice: speechSynthesis; at most one cue every 3 s so it doesn't nag.
let lastSay=0;
function say(t,force){if(!force&&Date.now()-lastSay<3000)return;lastSay=Date.now();try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang=S.lang=="hi"?"hi-IN":"en-IN";u.rate=.95;speechSynthesis.speak(u)}catch{}}
function cue(k,cls){const t=T[S.lang][k]||k;$("cue").textContent=t;$("cue").className=cls||"";return t}

let landmarker,stream,facing="user",run=null;
async function getModel(){
 if(landmarker)return landmarker;
 const fs=await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
 const opts=d=>({baseOptions:{modelAssetPath:"https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task",delegate:d},runningMode:"VIDEO",numPoses:1});
 try{landmarker=await PoseLandmarker.createFromOptions(fs,opts("GPU"))}catch{landmarker=await PoseLandmarker.createFromOptions(fs,opts("CPU"))}
 return landmarker;
}
async function openCam(){
 stream?.getTracks().forEach(t=>t.stop());
 stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:facing,width:{ideal:640},height:{ideal:480}},audio:false});
 const v=$("vid");v.srcObject=stream;await v.play();
 v.classList.toggle("mirror",facing=="user");$("cv").classList.toggle("mirror",facing=="user");
}
async function start(ex){
 const p=prog(ex.id),L=ex.levels[Math.min(p.level,ex.levels.length-1)];
 $("home").hidden=true;$("cam").hidden=false;$("name").textContent=ex.name+" · "+L[0];$("tip").textContent=ex.tip;
 run={ex,target:L[1],reps:0,good:0,state:"rest",ext:null,bad:false,seen:false};
 $("count").innerHTML=`0<small>/${L[1]}</small>`;cue("Loading…");
 try{await Promise.all([getModel(),openCam()])}catch(err){cue("Camera or model failed: "+err.message,"bad");return}
 say(cue("start"),true);loop();
}
const BONES=[[11,12],[11,13],[13,15],[12,14],[14,16],[11,23],[12,24],[23,24],[23,25],[25,27],[24,26],[26,28]];
function draw(lm,color){
 const c=$("cv"),v=$("vid"),x=c.getContext("2d");c.width=v.videoWidth;c.height=v.videoHeight;
 // object-fit:contain on both keeps canvas and video aligned and the whole body in view.
 x.clearRect(0,0,c.width,c.height);if(!lm)return;
 x.lineWidth=6;x.strokeStyle=color;x.fillStyle="#fff";
 for(const[a,b]of BONES){x.beginPath();x.moveTo(lm[a].x*c.width,lm[a].y*c.height);x.lineTo(lm[b].x*c.width,lm[b].y*c.height);x.stroke()}
 for(const i of[11,12,13,14,15,16,23,24,25,26,27,28]){x.beginPath();x.arc(lm[i].x*c.width,lm[i].y*c.height,6,0,7);x.fill()}
}
let smooth=null;
function loop(){
 if(!run)return;
 const v=$("vid");
 if(v.readyState>=2){
  AR=v.videoWidth/v.videoHeight;
  const r=landmarker.detectForVideo(v,performance.now()),lm=r.landmarks?.[0];
  step(lm);
 }
 requestAnimationFrame(loop);
}
// Rep state machine on a smoothed angle, with hysteresis between rest and act thresholds.
function step(lm){
 const R=run,ex=R.ex;
 if(!lm||!vis(lm,ex.need)){draw(lm,"#888");if(R.state=="rest")say(cue("body"));smooth=null;return}
 const raw=ex.metric(lm);smooth=smooth==null?raw:smooth*.6+raw*.4;const m=smooth;
 const active=ex.low?m<ex.act:m>ex.act,rested=ex.low?m>ex.rest:m<ex.rest;
 const mid=ex.low?m<ex.rest-10:m>ex.rest+10;
 if(R.state=="rest"&&mid){R.state="move";R.ext=m;R.bad=false}
 if(R.state=="move"){
  R.ext=ex.low?Math.min(R.ext,m):Math.max(R.ext,m);
  const f=ex.live(lm);if(f){R.bad=true;say(cue(f,"bad"))}
  if(rested){
   const f2=ex.end(R.ext);
   // A movement that never reached the active threshold is not a rep, but say why.
   if(!(ex.low?R.ext<ex.act:R.ext>ex.act)){if(f2)say(cue(f2,"bad"));R.state="rest";return}
   R.reps++;if(f2)R.bad=true;if(!R.bad)R.good++;
   $("count").innerHTML=`${R.reps}<small>/${R.target}</small>`;
   const t=R.bad?(f2?cue(f2,"bad"):$("cue").textContent):cue("good","good");
   say(S.lang=="hi"?`${R.reps}`:`${R.reps}`+(R.bad?"":". "+t),true);
   R.state="rest";
   if(R.reps==R.target)setTimeout(()=>say(S.lang=="hi"?"शाबाश, पूरा हुआ":"Great, target done",true),900);
  }
 }
 draw(lm,R.state=="move"&&R.bad?"#e0611a":"#0a8f5a");
}
function stopCam(){run=null;stream?.getTracks().forEach(t=>t.stop());stream=null;smooth=null;try{speechSynthesis.cancel()}catch{}}
$("quit").onclick=()=>{stopCam();home()};
$("flip").onclick=async()=>{facing=facing=="user"?"environment":"user";try{await openCam()}catch(e){cue(e.message,"bad")}};
$("done").onclick=()=>{
 const R=run;if(!R)return;stopCam();
 const p=prog(R.ex.id);let up=false;
 if(R.reps>0){p.log.push({d:today(),t:Date.now(),reps:R.reps,good:R.good,level:p.level});
  // ponytail: one good session moves you up; make it two in a row if parents level too fast.
  if(R.reps>=R.target&&R.good/R.reps>=.8&&p.level<R.ex.levels.length-1){p.level++;up=true}
  save()}
 const pct=R.reps?Math.round(R.good/R.reps*100):0,N=R.ex.levels[p.level];
 $("cam").hidden=true;$("result").hidden=false;
 $("result").innerHTML=`<h1>${R.ex.name}</h1><p class="res">${R.reps}<small style="font-size:24px"> / ${R.target} reps</small></p><p>${pct}% with good form</p>
 ${up?`<div class="up">${T[S.lang].level} Next time: ${esc(N[0])}, ${N[1]} reps</div>`:R.reps>=R.target?`<p class="soft">Target hit. Get 80% good form to level up.</p>`:`<p class="soft">Next time: ${R.target} reps. You can do it.</p>`}
 <p style="margin-top:20px"><button class="big" id="back">Back</button></p>`;
 if(up)say(T[S.lang].level,true);
 $("back").onclick=home;
};
home();
</script>
</body>
</html>
